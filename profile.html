<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐릭터 상세 프로필</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .profile-page-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            padding: 0.8rem 1.5rem;
            background: var(--sidebar-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 50px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--accent-color);
            color: white;
            transform: translateX(-5px);
        }

        .detail-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 4rem;
        }

        .detail-img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 8px solid var(--accent-color);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
            object-fit: cover;
            margin-bottom: 2rem;
        }

        .info-table {
            border-collapse: collapse;
            width: 100%;
            border: 2px solid var(--text-primary);
            background: var(--bg-color);
            margin-bottom: 3rem;
        }

        /* Custom spacing for page */
        .page-section {
            margin-top: 4rem;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div style="position: fixed; top: 2rem; right: 2rem; display: flex; gap: 1rem; z-index: 100;">
        <button onclick="openThemeModal()" class="back-btn" style="position: static;">
            <i class="fa-solid fa-palette"></i> 색상 변경
        </button>
        <a href="index.html" class="back-btn" style="position: static;">
            <i class="fa-solid fa-arrow-left"></i> 목록으로 돌아가기
        </a>
    </div>

    <div class="profile-page-container" id="profile-detail-view">
        <!-- JS will inject content here -->
        <div style="text-align: center; padding: 5rem;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 3rem; color: var(--accent-color);"></i>
            <p style="margin-top: 1rem;">프로필을 불러오는 중입니다...</p>
        </div>
    </div>

    <!-- Theme Modal -->
    <div id="theme-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeThemeModal()">&times;</span>
            <h2 id="theme-modal-title">색상 테마 설정</h2>
            <form id="theme-form">
                <div class="form-group">
                    <label for="theme-bg">전체 배경 색상</label>
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <input type="color" id="theme-bg"
                            style="width: 50px; height: 40px; padding: 0; border: none; cursor: pointer;">
                    </div>
                </div>
                <div class="form-group">
                    <label for="theme-sidebar">사이드바/박스 배경</label>
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <input type="color" id="theme-sidebar"
                            style="width: 50px; height: 40px; padding: 0; border: none; cursor: pointer;">
                    </div>
                </div>
                <div class="form-group">
                    <label for="theme-accent">강조(포인트) 색상</label>
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <input type="color" id="theme-accent"
                            style="width: 50px; height: 40px; padding: 0; border: none; cursor: pointer;">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="resetTheme()">초기화</button>
                    <button type="button" class="save-btn" onclick="saveTheme()">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="profile.js?v=1.5"></script>
</body>

</html>
