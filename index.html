<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조직놀이 - 시작하기</title>
    <!-- Force CSS refresh with v3.0 -->
    <link rel="stylesheet" href="style.css?v=3.0">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gate-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .gate-section {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }

        .gate-section::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            transition: background 0.5s ease;
            z-index: 1;
        }

        .gate-section:hover::after {
            background: rgba(0, 0, 0, 0.2);
        }

        .gate-section.blackleaf {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
        }

        .gate-section.grand {
            background: linear-gradient(135deg, #451a03 0%, #1c0a00 100%);
        }

        .gate-content {
            position: relative;
            z-index: 10;
            text-align: center;
            transform: translateY(20px);
            opacity: 0.8;
            transition: all 0.6s ease;
        }

        .gate-section:hover .gate-content {
            transform: translateY(0);
            opacity: 1;
        }

        .gate-logo {
            width: 320px;
            height: 320px;
            object-fit: contain;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 50px rgba(0, 0, 0, 0.8));
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .gate-section:hover .gate-logo {
            transform: scale(1.15);
        }

        .gate-title {
            color: #fff;
            font-size: 3.5rem;
            font-weight: 100;
            letter-spacing: 15px;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .accent-line {
            width: 0;
            height: 2px;
            background: #fff;
            margin: 1.5rem auto 0;
            transition: width 0.6s ease;
            opacity: 0.5;
        }

        .gate-section:hover .accent-line {
            width: 100px;
        }

        .vs-deco {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            font-style: italic;
            z-index: 5;
            pointer-events: none;
            letter-spacing: -10px;
        }
    </style>
</head>

<body class="landing-body">
    <div class="gate-container">
        <!-- Blackleaf Section -->
        <a href="main.html?category=category1" class="gate-section blackleaf">
            <div class="gate-content">
                <img src="blackleaf-logo.png?v=1.1" alt="Blackleaf Logo" class="gate-logo">
                <h1 class="gate-title">BLACKLEAF</h1>
                <div class="accent-line"></div>
            </div>
        </a>

        <!-- Grand Section -->
        <a href="main.html?category=category2" class="gate-section grand">
            <div class="gate-content">
                <img src="grand-logo.png?v=1.1" alt="Grand Logo" class="gate-logo">
                <h1 class="gate-title">GRAND</h1>
                <div class="accent-line"></div>
            </div>
        </a>
    </div>

    <div class="vs-deco">VS</div>
</body>

</html>
