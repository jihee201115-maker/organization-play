<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조직놀이 프로필 관리</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-users-gear"></i>
                <h2>조놀 관리</h2>
            </div>
            <ul class="nav-links">
                <li class="active" data-tab="category1">
                    <i class="fa-solid fa-leaf"></i>
                    <span>블랙리프</span>
                </li>
                <li data-tab="category2">
                    <i class="fa-solid fa-crown"></i>
                    <span>그랜드</span>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <div class="header-title">
                    <h1 id="page-title">블랙리프 프로필 관리</h1>
                    <p>프로필을 생성하고 수정할 수 있습니다.</p>
                </div>
                <div class="header-actions">
                    <div id="auth-section">
                        <!-- Auth buttons will be injected here -->
                    </div>
                    <button id="add-profile-btn" class="primary-btn" style="display: none;">
                        <i class="fa-solid fa-plus"></i> 프로필 추가
                    </button>
                </div>
            </header>

            <!-- Profile Grid -->
            <div class="profile-grid" id="profile-container">
                <!-- Profiles will be injected here by JS -->
            </div>
        </main>
    </div>

    <!-- Modal for Edit/Create -->
    <div id="profile-modal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title">프로필 추가</h2>
            <form id="profile-form">
                <input type="hidden" id="profile-id">
                <input type="hidden" id="profile-category">

                <div class="form-group">
                    <label for="profile-name">이름 / 코드네임</label>
                    <input type="text" id="profile-name" required placeholder="이름을 입력하세요">
                </div>

                <div class="form-group">
                    <label for="profile-role">직책 / 역할</label>
                    <input type="text" id="profile-role" required placeholder="직책을 입력하세요">
                </div>

                <div class="form-group">
                    <label for="profile-desc">설명 / 특징</label>
                    <textarea id="profile-desc" rows="4" placeholder="상세 설명을 입력하세요"></textarea>
                </div>

                <div class="form-group">
                    <label for="profile-image">이미지 URL</label>
                    <input type="url" id="profile-image" placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-actions">
                    <button type="button" class="cancel-btn">취소</button>
                    <button type="submit" class="save-btn">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Authentication Modal -->
    <div id="auth-modal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-btn" onclick="closeAuthModal()">&times;</span>
            <h2>로그인 / 회원가입</h2>
            <form id="auth-form" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="auth-email">이메일</label>
                    <input type="email" id="auth-email" required placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label for="auth-password">비밀번호</label>
                    <input type="password" id="auth-password" required placeholder="비밀번호 (6자 이상)">
                </div>

                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeAuthModal()">취소</button>
                    <button type="button" class="secondary-btn" onclick="signup()">회원가입</button>
                    <button type="button" class="save-btn" onclick="login()">로그인</button>
                </div>
            </form>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>

</html>
