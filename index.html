<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조직놀이 - 시작하기</title>
    <link rel="stylesheet" href="style.css?v=1.8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="landing-body">
    <div class="gate-container">
        <!-- Blackleaf Section -->
        <a href="main.html?category=category1" class="gate-section blackleaf">
            <div class="gate-bg-text">BLACK LEAF</div>
            <div class="gate-logo-container">
                <img src="blackleaf-logo.png?v=1.1" alt="Blackleaf Logo" class="gate-logo">
                <h1 class="gate-title">BLACK LEAF</h1>
                <p class="gate-desc">진정한 그림자의 지배자들</p>
            </div>
        </a>

        <!-- Grand Section -->
        <a href="main.html?category=category2" class="gate-section grand">
            <div class="gate-bg-text">GRAND</div>
            <div class="gate-logo-container">
                <img src="grand-logo.png?v=1.1" alt="Grand Logo" class="gate-logo">
                <h1 class="gate-title">GRAND</h1>
                <p class="gate-desc">최고의 명예와 위대한 유산</p>
            </div>
        </a>
    </div>

    <!-- Background Decoration -->
    <div
        style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.05); font-size: 20rem; font-weight: 900; z-index: -1; pointer-events: none;">
        VS</div>
</body>

</html>
